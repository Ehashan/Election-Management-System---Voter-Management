{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Admin Login</h2>
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_username">Username</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            {{ form.password }}
        </div>

        {% if form.errors %}
        <div class="error" style="margin-bottom: 10px;">Invalid credentials</div>
        {% endif %}

        <div style="display: flex; justify-content: flex-end;">
            <button type="submit" class="btn btn-secondary">Login</button>
        </div>
    </form>
</div>
{% endblock %}
