{% extends 'base.html' %}

{% block content %}
<div class="home-hero-section">
    <div class="hero-bg-layer" aria-hidden="true"></div>
    <div class="hero-overlay-layer" aria-hidden="true"></div>

    <div class="voting-modal-card">
        <div class="modal-badge">
            <span class="badge-dot"></span>
            <span>Election Management System</span>
        </div>

        <h2 class="modal-title" data-i18n="home_title">Welcome to the Future of Voting</h2>
        <p class="modal-subtitle" data-i18n="home_subtitle">Secure. Transparent. Efficient.</p>

        <div class="modal-actions">
            <a href="{% url 'voter_signup' %}" class="btn btn-hero-primary" data-i18n="home_voter_btn">Sign Up / Sign In as Voter</a>
            <a href="{% url 'admin_login' %}" class="btn btn-hero-secondary" data-i18n="home_admin_btn">Logging as Admin</a>
        </div>

        <div class="modal-features">
            <div class="feature-item">
                <span class="feature-icon"></span>
                <span>Encrypted & Secure</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon"></span>
                <span>Transparent Balloting</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon"></span>
                <span>Fast Verification</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
