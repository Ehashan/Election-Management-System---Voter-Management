{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div id="content-main">
    <div class="module" style="max-width: 600px; margin: 0 auto;">
        <h2>{{ title }}</h2>

        <form method="post" style="padding: 20px;">
            {% csrf_token %}

            <div class="form-row" style="margin-bottom: 15px;">
                <label for="nic" style="display: block; font-weight: bold; margin-bottom: 5px;">NIC / SLIN:</label>
                <input type="text" name="nic" id="nic" required
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="form-row" style="margin-bottom: 15px;">
                <label for="name" style="display: block; font-weight: bold; margin-bottom: 5px;">Full Name:</label>
                <input type="text" name="name" id="name" required
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="form-row" style="margin-bottom: 15px;">
                <label for="email" style="display: block; font-weight: bold; margin-bottom: 5px;">Email:</label>
                <input type="email" name="email" id="email"
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="form-row" style="margin-bottom: 15px;">
                <label for="mobile" style="display: block; font-weight: bold; margin-bottom: 5px;">Mobile
                    Number:</label>
                <input type="text" name="mobile" id="mobile"
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="submit-row" style="margin-top: 20px; text-align: right;">
                <input type="submit" value="Save" class="default"
                    style="background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            </div>
        </form>
    </div>
</div>
{% endblock %}
